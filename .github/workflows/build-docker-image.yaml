name: Build and Publish Docker Image

on: # yamllint disable-line rule:truthy
  workflow_dispatch:
    inputs:
      target:
        description: "Docker image target to build"
        required: false
        default: "immich-takeout-sync"
        type: string
      tag:
        description: "Tag to publish (overrides dockerTools tag if specified)"
        required: false
        type: string
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            nix-system: x86_64-linux
          - arch: arm64
            runner: ubuntu-24.04-arm
            nix-system: aarch64-linux
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
            extra-experimental-features = configurable-impure-env fetch-tree flakes nix-command
            access-tokens = github.com/dszakallas=${{ secrets.WORKFLOW_TOKEN }}
            impure-env = NIX_DSZAKALLAS_GITHUB_PRIVATE_USERNAME=dszakallas NIX_DSZAKALLAS_GITHUB_PRIVATE_PASSWORD=${{ secrets.WORKFLOW_TOKEN }}

      - name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          name: devenv

      - name: Build Docker image with Nix
        id: build
        run: |
          TARGET="${{ inputs.target }}"
          if [ -z "${TARGET}" ]; then
            TARGET="immich-takeout-sync"
          fi
          IMAGE_PATH=$(nix build .#dockerImages.${{ matrix.nix-system }}.${TARGET} --print-out-paths)
          IMAGE_TAG=$(nix eval --raw .#dockerImages.${{ matrix.nix-system }}.${TARGET}.imageTag)
          IMAGE_NAME=$(nix eval --raw .#dockerImages.${{ matrix.nix-system }}.${TARGET}.imageName)

          mkdir -p output
          cp "${IMAGE_PATH}" "output/image-${{ matrix.arch }}.tar.gz"

          echo "${TARGET}" > output/target.txt
          echo "${IMAGE_NAME}" > output/image_name.txt
          echo "${IMAGE_TAG}" > output/image_tag.txt

      - name: Upload image artifact
        uses: actions/upload-artifact@v7
        with:
          name: image-${{ matrix.arch }}
          path: output/
          retention-days: 1

  publish-multiarch:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download all image artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Inspect downloaded artifacts
        run: |
          ls -la artifacts/
          ls -la artifacts/image-amd64/
          ls -la artifacts/image-arm64/

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag, push, and create multiarch manifest
        run: |
          TARGET=$(cat artifacts/image-amd64/target.txt)
          IMAGE_NAME=$(cat artifacts/image-amd64/image_name.txt)
          IMAGE_TAG=$(cat artifacts/image-amd64/image_tag.txt)

          REPO="ghcr.io/${{ github.repository_owner }}/${TARGET}"

          # Resolve publish version tag
          PUBLISH_TAG="${{ inputs.tag }}"
          if [ -z "${PUBLISH_TAG}" ]; then
            if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
              PUBLISH_TAG="${GITHUB_REF_NAME#v}"
            else
              PUBLISH_TAG="${IMAGE_TAG}"
            fi
          fi

          TAG_AMD64="${REPO}:${PUBLISH_TAG}-amd64"
          TAG_ARM64="${REPO}:${PUBLISH_TAG}-arm64"

          # Load and push amd64 image
          docker load < artifacts/image-amd64/image-amd64.tar.gz
          docker tag "${IMAGE_NAME}:${IMAGE_TAG}" "${TAG_AMD64}"
          docker push "${TAG_AMD64}"
          DIGEST_AMD64=$(docker inspect --format '{{index .RepoDigests 0}}' "${TAG_AMD64}" | cut -d'@' -f2)

          # Load and push arm64 image
          docker load < artifacts/image-arm64/image-arm64.tar.gz
          docker tag "${IMAGE_NAME}:${IMAGE_TAG}" "${TAG_ARM64}"
          docker push "${TAG_ARM64}"
          DIGEST_ARM64=$(docker inspect --format '{{index .RepoDigests 0}}' "${TAG_ARM64}" | cut -d'@' -f2)

          TARGET_IMAGE_TAG="${REPO}:${PUBLISH_TAG}"
          docker manifest create "${TARGET_IMAGE_TAG}" "${REPO}@${DIGEST_AMD64}" "${REPO}@${DIGEST_ARM64}"
          docker manifest push "${TARGET_IMAGE_TAG}"
          echo "Published multiarch image: ${TARGET_IMAGE_TAG}"
